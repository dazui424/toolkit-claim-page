<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="description" content="工具包领取页面">
  <title>领取工具包</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="topbar" aria-hidden="true">
    <span>领取中心</span>
  </div>

  <main>
    <header class="hero">
      <div class="toolkit-icon" aria-hidden="true">
        <span></span>
      </div>
      <p class="eyebrow">订单权益</p>
      <h1>领取工具包</h1>
      <p class="subtitle">下单成功，专属工具包已为你准备好</p>
    </header>

    <section class="order" aria-labelledby="toolkit-title">
      <div class="cover" aria-hidden="true">工具包</div>
      <div class="order-copy">
        <p>待领取内容</p>
        <h2 id="toolkit-title">你的专属工具包</h2>
        <span><i aria-hidden="true"></i>领取资格已确认</span>
      </div>
    </section>

    <section class="action-area" aria-label="领取操作">
      <button id="claim-button" class="claim-button" type="button">
        点击领取工具包
      </button>
      <p id="claim-tip" class="claim-tip">点击后将显示工具包领取网站</p>

      <div id="result" class="result" hidden>
        <div class="success" aria-hidden="true">✓</div>
        <h2>领取链接已生成</h2>
        <p>点击下方网站链接，进入二维码领取页面</p>

        <a id="website-link" class="website-link" href="https://dazui424.github.io/toolkit-claim-page/">
          https://dazui424.github.io/toolkit-claim-page/
        </a>

        <a class="open-button" href="https://dazui424.github.io/toolkit-claim-page/">
          打开领取网站
        </a>
        <button id="copy-button" class="copy-button" type="button">复制网站链接</button>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <ol class="steps" aria-label="领取说明">
      <li><span>1</span><p>点击“领取工具包”</p></li>
      <li><span>2</span><p>打开显示的网站链接</p></li>
      <li><span>3</span><p>扫描二维码完成领取</p></li>
    </ol>

    <footer>如有疑问，请联系下单店铺客服</footer>
  </main>
</body>
</html>
