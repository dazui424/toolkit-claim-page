<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="扫描企业微信二维码领取工具包">
  <title>领取工具包</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="wecom-qr.webp" as="image" type="image/webp">
  <style>
    :root {
      --accent: #2378e8;
      --accent-soft: #d9eaff;
      --text: #0a2343;
      --muted: #61728a;
      --border: #e2e9f2;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: #fff;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(42px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    header { text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 38px);
      line-height: 1.22;
      letter-spacing: .01em;
    }

    header p {
      margin: 18px 0 0;
      color: #38526e;
      font-size: clamp(16px, 4.2vw, 19px);
      line-height: 1.7;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 38px;
      padding: 15px 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 26px rgb(30 76 132 / 4%);
    }

    .cover {
      width: 84px;
      height: 84px;
      flex: 0 0 84px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #1468dc, #53a8ff);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 20%);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .summary h2 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(20px, 5.2vw, 25px);
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 10px 0 0;
      color: var(--accent);
      font-size: 16px;
    }

    .check {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .divider {
      margin: 30px 0 26px;
      border-top: 1px dashed var(--border);
    }

    .qr-wrap {
      width: min(100%, 360px);
      margin: 0 auto;
      padding: 9px;
      border: 2px solid #b9d8ff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgb(24 96 183 / 12%);
    }

    .qr {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      user-select: none;
      -webkit-touch-callout: default;
    }

    ol {
      margin: 24px 10px 0;
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 60px;
      border-bottom: 1px solid var(--border);
    }

    li span {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 650;
    }

    li p {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
    }

    footer {
      margin-top: 26px;
      color: #8a98aa;
      font-size: 15px;
      text-align: center;
    }

    @media (max-width: 380px) {
      main { padding-right: 18px; padding-left: 18px; }
      .summary { gap: 14px; padding: 13px 14px; }
      .cover { width: 72px; height: 72px; flex-basis: 72px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <header>
      <h1 id="page-title">领取工具包</h1>
      <p>请使用微信扫描下方二维码，添加企业微信领取工具包</p>
    </header>

    <section class="summary" aria-label="工具包信息">
      <div class="cover" aria-hidden="true">工具包</div>
      <div>
        <h2>你的专属工具包</h2>
        <p class="status"><span class="check" aria-hidden="true">✓</span>扫码即可领取</p>
      </div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section aria-label="工具包领取二维码">
      <div class="qr-wrap">
        <img class="qr" src="wecom-qr.webp" alt="添加企业微信的二维码" width="720" height="720" fetchpriority="high" decoding="async">
      </div>
    </section>

    <ol aria-label="领取步骤">
      <li><span>1</span><p>长按保存企微二维码</p></li>
      <li><span>2</span><p>打开微信扫一扫</p></li>
      <li><span>3</span><p>从相册选择二维码</p></li>
    </ol>

    <footer>如有问题，请添加企业微信咨询</footer>
  </main>
</body>
</html>
